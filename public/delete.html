
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete Food | Udaya Food Corner</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .delete-card {
      max-width: 480px;
      margin: 60px auto;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 25px #39251f18;
    }
    .delete-card input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      box-sizing: border-box;
    }
    .delete-button {
      background: #b83227;
    }
    .message {
      margin-top: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="delete-card">
    <h1>🗑️ Delete Food Item</h1>
    <p>Enter the ID of the food item you want to remove.</p>

    <form id="deleteForm">
      <label for="foodId">Food ID</label>
      <input type="number" id="foodId" min="1"
             placeholder="Enter food ID" required>
      <button type="submit" class="delete-button">
        Delete Food
      </button>
    </form>

    <p id="message" class="message" role="status"></p>
    <p><a href="menu.html">← Back to Menu</a></p>
  </main>

  <script>
    document.getElementById('deleteForm')
      .addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('foodId').value;
        const message = document.getElementById('message');

        if (!confirm('Are you sure you want to delete food ID ' + id + '?')) {
          return;
        }

        message.textContent = 'Deleting...';

        try {
          const response = await fetch('/api/food/' + id, {
            method: 'DELETE'
          });

          const result = await response.json();

          if (!response.ok) throw new Error(result.error);

          message.textContent = result.message;
          document.getElementById('foodId').value = '';
        } catch (err) {
          message.textContent = err.message || 'Could not delete food.';
        }
      });
  </script>
</body>
</html>
